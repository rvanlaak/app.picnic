<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <style>
    /*
     * Sizes and spacing come from Homey's own style library so the widget sits
     * on a dashboard next to the built-in ones without looking imported, with
     * fallbacks for every variable: a missing one would otherwise collapse the
     * layout rather than merely change it. Everything is sized in em so that
     * Homey's font scale setting takes the whole widget with it.
     */
    body {
      margin: 0;
      overflow: hidden;
    }

    .delivery {
      box-sizing: border-box;
      height: 100vh;
      padding: var(--homey-su-4, 16px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: var(--homey-su-1, 4px);

      /* the state decides the one colour on the widget, see view() */
      --accent: #e40613;
      --warn: #f2a20c;
    }

    .delivery[data-tappable="true"] {
      cursor: pointer;
    }

    .top {
      display: flex;
      align-items: center;
      gap: var(--homey-su-2, 8px);
      margin-bottom: var(--homey-su-1, 4px);
      min-height: 1.2em;
    }

    .pip {
      flex: none;
      width: 0.5em;
      height: 0.5em;
      border-radius: 50%;
      background: var(--accent);
    }

    .state {
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .price {
      margin-left: auto;
      flex: none;
      opacity: 0.6;
    }

    .headline {
      font-size: 1.75em;
      line-height: 1.15;
      /* a countdown is read at a glance, a sentence is read; both have to fit */
      overflow: hidden;
    }

    .headline[data-kind="message"] {
      font-size: 1.1em;
      line-height: 1.3;
    }

    .detail {
      opacity: 0.6;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track {
      position: relative;
      margin-top: var(--homey-su-3, 12px);
      height: 4px;
      border-radius: 2px;
      overflow: hidden;
    }

    /* the faint part of the bar is drawn behind the fill rather than under it:
       an opacity on the track would take the fill inside it down with it. It
       is tied to the text colour, which is the one thing that already follows
       the theme the dashboard is in. */
    .track::before {
      content: "";
      position: absolute;
      inset: 0;
      background: currentColor;
      opacity: 0.15;
    }

    .fill {
      position: relative;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width 0.4s ease-out;
    }

    .footnote {
      margin-top: var(--homey-su-2, 8px);
      opacity: 0.6;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* the last minutes before the order closes are the one thing on here worth
       hurrying for, so they are the one thing that is not grey */
    .footnote[data-urgent="true"] {
      color: var(--warn);
      opacity: 1;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body class="homey-widget">
  <div class="delivery" id="delivery">
    <div class="top" id="top">
      <span class="pip"></span>
      <span class="state homey-text-small" id="state"></span>
      <span class="price homey-text-small" id="price" hidden></span>
    </div>

    <div class="headline homey-text-bold" id="headline" aria-live="polite"></div>
    <div class="detail homey-text-small" id="detail"></div>

    <div class="track" id="track" hidden>
      <div class="fill" id="fill"></div>
    </div>

    <div class="footnote homey-text-small" id="footnote" hidden></div>
  </div>

  <script type="text/javascript">
    // How often the app is asked again. It also says so itself the moment
    // something changes, so this is the net underneath that rather than the
    // way the widget finds out.
    var REFRESH_INTERVAL = 30 * 1000;

    // How often what is on screen is worked out again. Nothing here is ever
    // counted down in seconds, so this only has to be often enough that the
    // minute it shows is never noticeably behind the minute it is.
    var TICK_INTERVAL = 20 * 1000;

    // Below this, the cut off is close enough to hurry for and is counted down
    // in minutes rather than named as a time.
    var CUT_OFF_URGENT_MINUTES = 60;

    // What each state colours the widget, and whether its headline is a
    // countdown or something to read.
    var STATES = {
      'ordered': { accent: '#e40613', chip: 'ordered', kind: 'countdown' },
      'announced': { accent: '#e40613', chip: 'announced', kind: 'countdown' },
      'arriving': { accent: '#e40613', chip: 'arriving', kind: 'message' },
      'overdue': { accent: '#f2a20c', chip: 'arriving', kind: 'message' },
      'delivered': { accent: '#28a05c', chip: 'delivered', kind: 'countdown' },
      'idle': { accent: 'currentColor', chip: null, kind: 'message' },
      'signed_out': { accent: '#f2a20c', chip: null, kind: 'message' }
    };

    var homey = null;
    var settings = {};
    var state = null;

    // Homey's clock, minus the clock of whatever is showing the dashboard. A
    // tablet running four minutes fast would otherwise count down to a minute
    // that is not the one the app is working towards.
    var clockOffset = 0;

    function element(id) {
      return document.getElementById(id);
    }

    function onHomeyReady(Homey) {
      homey = Homey;
      settings = Homey.getSettings() || {};

      // the app announces a new state as soon as it has one, which is what
      // makes an announcement show up on the dashboard while you look at it
      Homey.on('delivery_state', adopt);

      element('delivery').dataset.tappable = settings['open_on_tap'] === false ? 'false' : 'true';
      element('delivery').addEventListener('click', tap);

      var shown = false;
      var show = function () {
        if (shown) return;
        shown = true;
        Homey.ready();
      };

      // whatever the first call does, the widget is not left hidden over it
      setTimeout(show, 3000);
      refresh().then(show, show);

      setInterval(refresh, REFRESH_INTERVAL);
      setInterval(render, TICK_INTERVAL);
    }

    function refresh() {
      return homey.api('GET', '/state').then(adopt, function (error) {
        // the state on screen is the last one the app confirmed, which beats
        // replacing it with an error over a poll that will be tried again
        console.error(error);
      });
    }

    function adopt(data) {
      if (!data || typeof data != 'object') return;

      state = data;
      clockOffset = Date.parse(data['now']) - Date.now();
      if (isNaN(clockOffset)) clockOffset = 0;

      render();
    }

    // Tapping the widget opens Picnic, which is what someone who just read
    // that the order closes in twenty minutes wants next.
    function tap() {
      if (settings['open_on_tap'] === false) return;
      if (state === null || !state['popupUrl']) return;

      try {
        // only allowed in the moment right after a touch, and only on newer
        // firmware, so a runtime without it must not take the tap with it
        homey.hapticFeedback();
      } catch (exception) {
        console.error(exception);
      }

      Promise.resolve(homey.popup(state['popupUrl'])).catch(console.error);
    }

    // The widget's idea of what time it is, which is Homey's.
    function now() {
      return Date.now() + clockOffset;
    }

    function label(key) {
      return (state && state['labels'] && state['labels'][key]) || '';
    }

    function count(key, value) {
      return label(key).replace('__n__', String(value));
    }

    function substitute(key, value) {
      return label(key).replace('__t__', value);
    }

    function money(amount) {
      try {
        return new Intl.NumberFormat(undefined, { style: 'currency', currency: 'EUR' }).format(amount);
      } catch (exception) {
        return '€ ' + amount.toFixed(2);
      }
    }

    // How long is left, in the largest unit that still says something useful.
    // Minutes are rounded up so that a delivery does not arrive "in 0 min",
    // and are the smallest unit on here: a dashboard is read in passing, and
    // seconds ticking away would be movement without information.
    function remaining(target) {
      var left = Date.parse(target) - now();
      if (isNaN(left) || left <= 0) return label('now');

      var minutes = Math.ceil(left / 60000);
      if (minutes < 60) return count(minutes == 1 ? 'minute' : 'minutes', minutes);

      var hours = Math.round(left / 3600000);
      if (hours < 24) return count(hours == 1 ? 'hour' : 'hours', hours);

      var days = Math.round(left / 86400000);
      return count(days == 1 ? 'day' : 'days', days);
    }

    function windowText(data) {
      if (!data['windowStart'] || !data['windowEnd']) return data['windowStart'] || '';
      return data['windowStart'] + ' – ' + data['windowEnd'];
    }

    function price(data) {
      if (settings['show_price'] === false) return '';

      var amount = data['price'];
      if (typeof amount != 'number' || !isFinite(amount) || amount <= 0) return '';

      return money(amount);
    }

    // The one thing on the widget that can still be acted on: Picnic keeps an
    // order open until the slot's cut off moment. Hours away that is a time to
    // remember, minutes away it is something to hurry for, and once it has
    // passed there is nothing left to say about it.
    function cutOff(data) {
      if (!data['cutOffAt']) return null;

      var left = Date.parse(data['cutOffAt']) - now();
      if (isNaN(left) || left <= 0) return null;

      var minutes = Math.ceil(left / 60000);
      if (minutes <= CUT_OFF_URGENT_MINUTES) return { text: count('cut-off-in', minutes), urgent: true };

      return { text: substitute('cut-off-at', data['cutOffTime']), urgent: false };
    }

    // With no delivery to report, the cart is what the widget has to say. An
    // empty one is not worth a tile, and a response this version cannot read
    // leaves it as it was: saying nothing is planned, which is true.
    function cartLines(data) {
      var cart = data['cart'];
      if (!cart) return null;

      var total = cart['totalPrice'];
      if (typeof total != 'number' || !isFinite(total) || total <= 0) return null;

      var products = cart['productCount'];
      var minimum = cart['minimumOrderValue'];
      var short = typeof minimum == 'number' && isFinite(minimum) && total < minimum ? minimum - total : null;

      return {
        chip: label('cart'),
        headline: money(total),
        detail: typeof products == 'number' && products > 0 ? count(products == 1 ? 'item' : 'items', products) : '',
        footnote: short === null ? null : { text: substitute('minimum', money(short)), urgent: true }
      };
    }

    // What the headline says, and the line underneath it.
    function lines(data) {
      switch (data['state']) {
        case 'ordered':
        case 'announced':
          return data['countdownTo']
            ? { headline: remaining(data['countdownTo']), detail: join(data['day'], windowText(data)) }
            : { headline: label('ordered'), detail: '', kind: 'message' };
        case 'arriving':
          return { headline: label('now'), detail: join(data['day'], windowText(data)) };
        case 'overdue':
          return { headline: label('overdue'), detail: join(data['day'], windowText(data)) };
        case 'delivered':
          return { headline: data['deliveredTime'], detail: data['day'] };
        case 'signed_out':
          return { headline: label('signed-out'), detail: '' };
        default:
          return { headline: label('idle'), detail: '' };
      }
    }

    function join(left, right) {
      if (!left) return right || '';
      if (!right) return left;
      return left + ' · ' + right;
    }

    // Everything on screen, worked out before any of it is put there.
    function view() {
      var cart = state['state'] == 'idle' ? cartLines(state) : null;

      if (cart !== null) {
        return {
          accent: STATES['ordered'].accent,
          chip: cart.chip,
          kind: 'countdown',
          headline: cart.headline,
          detail: cart.detail,
          // the price of the last order says nothing about the cart in front
          // of it, and two amounts next to each other would invite reading one
          // as the other
          price: '',
          progress: null,
          footnote: cart.footnote
        };
      }

      var appearance = STATES[state['state']] || STATES['idle'];
      var text = lines(state);

      return {
        accent: appearance.accent,
        chip: appearance.chip ? label(appearance.chip) : '',
        kind: text.kind || appearance.kind,
        headline: text.headline,
        detail: text.detail,
        price: price(state),
        progress: state['progress'],
        footnote: cutOff(state)
      };
    }

    function render() {
      if (state === null) return;

      var showing = view();

      element('delivery').style.setProperty('--accent', showing.accent);

      element('top').hidden = showing.chip == '';
      element('state').textContent = showing.chip;

      element('price').textContent = showing.price;
      element('price').hidden = showing.price == '';

      element('headline').textContent = showing.headline;
      element('headline').dataset.kind = showing.kind;

      element('detail').textContent = showing.detail;

      var progress = showing.progress;
      var known = typeof progress == 'number' && isFinite(progress);
      element('track').hidden = !known;
      element('fill').style.width = known ? Math.round(progress * 100) + '%' : '0%';

      element('footnote').textContent = showing.footnote ? showing.footnote.text : '';
      element('footnote').dataset.urgent = showing.footnote && showing.footnote.urgent ? 'true' : 'false';
      element('footnote').hidden = !showing.footnote;
    }
  </script>
</body>

</html>
