<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <style>
    /*
     * Sizes, colours and spacing come from Homey's widget style library so the
     * widget sits on a dashboard next to the built-in ones without looking
     * imported, and follows the dashboard into dark mode by itself. Every
     * variable has a fallback: a missing one would otherwise collapse the
     * layout rather than merely change it.
     *
     * One layout for every state, so a glance lands in the same place whatever
     * the widget is saying: what this is about at the top, the one thing worth
     * reading large at the bottom, with its detail and what to do about it
     * underneath.
     */
    body {
      margin: 0;
      overflow: hidden;
    }

    .tile {
      box-sizing: border-box;
      height: 100vh;
      padding: var(--homey-su-4, 16px);
      display: flex;
      flex-direction: column;
      font-variant-numeric: tabular-nums;

      --brand: #e40613;
      --warn: var(--homey-color-orange, #f2a20c);
      --good: var(--homey-color-green, #28a05c);
      --muted: var(--homey-text-color-light, #8a8a8a);
      /* the one colour a state gives the widget, see STATES below */
      --tone: var(--muted);
    }

    /* Picnic's red, lifted a little on a dark dashboard where the brand red
       itself is too dark to read as text */
    .homey-dark-mode .tile {
      --brand: #ff4b52;
    }

    .tile[data-tone="brand"] { --tone: var(--brand); }
    .tile[data-tone="warn"] { --tone: var(--warn); }
    .tile[data-tone="good"] { --tone: var(--good); }

    .head {
      display: flex;
      align-items: center;
      gap: var(--homey-su-2, 8px);
      min-width: 0;
    }

    .badge {
      flex: none;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: var(--tone);
      background: rgba(128, 128, 128, 0.14);
      background: color-mix(in srgb, var(--tone) 14%, transparent);
    }

    .badge svg {
      display: none;
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .badge[data-icon="bag"] .i-bag,
    .badge[data-icon="truck"] .i-truck,
    .badge[data-icon="clock"] .i-clock,
    .badge[data-icon="check"] .i-check,
    .badge[data-icon="cart"] .i-cart,
    .badge[data-icon="alert"] .i-alert {
      display: block;
    }

    .status {
      min-width: 0;
      font-size: var(--homey-font-size-small, 14px);
      line-height: var(--homey-line-height-small, 20px);
      font-weight: var(--homey-font-weight-medium, 500);
      color: var(--tone);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta {
      margin-left: auto;
      flex: none;
      font-size: var(--homey-font-size-small, 14px);
      line-height: var(--homey-line-height-small, 20px);
      color: var(--muted);
    }

    .body {
      margin-top: auto;
      min-width: 0;
    }

    /* A number is read at a glance, so it is the large thing on the widget
       and the words around it ("in", "min") are set small beside it. It grows
       with the width of the tile: a full width widget has room to spare. */
    .headline {
      display: flex;
      align-items: baseline;
      gap: 0.3em;
      min-width: 0;
      color: var(--homey-text-color, inherit);
      white-space: nowrap;
      overflow: hidden;
    }

    .value {
      font-size: clamp(30px, 11vw, 40px);
      line-height: 1.1;
      font-weight: var(--homey-font-weight-bold, 700);
      letter-spacing: -0.02em;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pre,
    .unit {
      flex: none;
      font-size: var(--homey-font-size-default, 17px);
      font-weight: var(--homey-font-weight-medium, 500);
      color: var(--muted);
    }

    /* a sentence is read rather than glanced at, and may take two lines */
    .headline[data-kind="message"] .value {
      font-size: var(--homey-font-size-large, 20px);
      line-height: 24px;
      letter-spacing: 0;
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .detail,
    .note {
      font-size: var(--homey-font-size-small, 14px);
      line-height: var(--homey-line-height-small, 20px);
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* when and at what time, next to each other where there is room for it */
    .when:not(:empty) + .what:not(:empty)::before {
      content: " · ";
    }

    .track {
      position: relative;
      margin-top: var(--homey-su-3, 12px);
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
    }

    /* the empty part of the bar is drawn behind the fill rather than under
       it: an opacity on the track would take the fill inside it down with it */
    .track::before {
      content: "";
      position: absolute;
      inset: 0;
      background: currentColor;
      opacity: 0.12;
    }

    .fill {
      position: relative;
      height: 100%;
      border-radius: inherit;
      background: var(--tone);
      transition: width 0.4s ease-out;
    }

    .note {
      margin-top: var(--homey-su-2, 8px);
    }

    .note[data-tone="warn"],
    .note[data-tone="good"] {
      font-weight: var(--homey-font-weight-medium, 500);
    }

    .note[data-tone="warn"] { color: var(--warn); }
    .note[data-tone="good"] { color: var(--good); }

    /* A half width tile on a phone has room for one thing per line, so the
       amount next to the status makes way for the status itself. */
    @media (max-width: 239px) {
      .meta {
        display: none;
      }

      .head {
        gap: 6px;
      }

      .badge {
        width: 24px;
        height: 24px;
        border-radius: 7px;
      }

      .badge svg {
        width: 14px;
        height: 14px;
      }

      /* and where there is not, underneath each other */
      .detail {
        white-space: normal;
      }

      .detail span {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .when:not(:empty) + .what:not(:empty)::before {
        content: none;
      }

      .note {
        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body class="homey-widget-full">
  <div class="tile" id="tile">
    <div class="head">
      <span class="badge" id="badge" aria-hidden="true">
        <svg class="i-bag" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" /><path d="M3 6h18" /><path d="M16 10a4 4 0 0 1-8 0" /></svg>
        <svg class="i-truck" viewBox="0 0 24 24"><path d="M1 3h15v13H1z" /><path d="M16 8h4l3 3v5h-7z" /><circle cx="5.5" cy="18.5" r="2.5" /><circle cx="18.5" cy="18.5" r="2.5" /></svg>
        <svg class="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></svg>
        <svg class="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></svg>
        <svg class="i-cart" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1" /><circle cx="20" cy="21" r="1" /><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6" /></svg>
        <svg class="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 8v4" /><path d="M12 16h.01" /></svg>
      </span>
      <span class="status" id="status"></span>
      <span class="meta" id="meta"></span>
    </div>

    <div class="body">
      <div class="headline" id="headline" aria-live="polite"><span class="pre" id="pre"></span><span class="value" id="value"></span><span class="unit" id="unit"></span></div>
      <div class="detail" id="detail"><span class="when" id="when"></span><span class="what" id="what"></span></div>

      <div class="track" id="track" hidden>
        <div class="fill" id="fill"></div>
      </div>

      <div class="note" id="note" hidden></div>
    </div>
  </div>

  <script type="text/javascript">
    // How often the app is asked again. It also says so itself the moment
    // something changes, so this is the net underneath that rather than the
    // way the widget finds out.
    var REFRESH_INTERVAL = 30 * 1000;

    // How often what is on screen is worked out again. Nothing here is ever
    // counted down in seconds, so this only has to be often enough that the
    // minute it shows is never noticeably behind the minute it is.
    var TICK_INTERVAL = 20 * 1000;

    // Below this, a deadline is close enough to hurry for and is counted down
    // in minutes rather than named as a moment.
    var URGENT_MINUTES = 60;

    // What each state looks like: its colour, its icon and what it is called
    // at the top. The words themselves come from the app.
    var STATES = {
      'ordered': { tone: 'brand', icon: 'bag', status: 'ordered' },
      'announced': { tone: 'brand', icon: 'truck', status: 'announced' },
      'arriving': { tone: 'brand', icon: 'truck', status: 'arriving' },
      'overdue': { tone: 'warn', icon: 'clock', status: 'overdue' },
      'delivered': { tone: 'good', icon: 'check', status: 'delivered' },
      'cart': { tone: 'brand', icon: 'cart', status: 'cart' },
      'empty': { tone: 'muted', icon: 'cart', status: null },
      'signed_out': { tone: 'warn', icon: 'alert', status: null },
      'stale': { tone: 'warn', icon: 'alert', status: null }
    };

    var homey = null;
    var settings = {};
    var state = null;

    // Homey's clock, minus the clock of whatever is showing the dashboard. A
    // tablet running four minutes fast would otherwise count down to a minute
    // that is not the one the app is working towards.
    var clockOffset = 0;

    function element(id) {
      return document.getElementById(id);
    }

    function onHomeyReady(Homey) {
      homey = Homey;
      settings = Homey.getSettings() || {};

      // the app announces a new state as soon as it has one, which is what
      // makes an announcement show up on the dashboard while you look at it
      Homey.on('delivery_state', adopt);

      var shown = false;
      var show = function () {
        if (shown) return;
        shown = true;
        Homey.ready();
      };

      // whatever the first call does, the widget is not left hidden over it
      setTimeout(show, 3000);
      refresh().then(show, show);

      setInterval(refresh, REFRESH_INTERVAL);
      setInterval(render, TICK_INTERVAL);
    }

    function refresh() {
      return homey.api('GET', '/state').then(adopt, function (error) {
        // the state on screen is the last one the app confirmed, which beats
        // replacing it with an error over a poll that will be tried again
        console.error(error);
      });
    }

    function adopt(data) {
      if (!data || typeof data != 'object') return;

      state = data;
      clockOffset = Date.parse(data['now']) - Date.now();
      if (isNaN(clockOffset)) clockOffset = 0;

      render();
    }

    // The widget's idea of what time it is, which is Homey's.
    function now() {
      return Date.now() + clockOffset;
    }

    function label(key) {
      return (state && state['labels'] && state['labels'][key]) || '';
    }

    // The labels arrive as sentences with __n__, __t__ and __a__ in them,
    // because the number, the moment or the amount to put in is only known
    // here: the app is not asked anything while the minutes tick away.
    function text(key, values) {
      var filled = label(key);

      for (var name in values) {
        filled = filled.replace('__' + name + '__', String(values[name]));
      }

      return filled;
    }

    function isAmount(value) {
      return typeof value == 'number' && isFinite(value);
    }

    function money(amount) {
      try {
        return new Intl.NumberFormat((state && state['locale']) || undefined, { style: 'currency', currency: 'EUR' }).format(amount);
      } catch (exception) {
        return '€ ' + amount.toFixed(2);
      }
    }

    function showPrices() {
      return settings['show_price'] !== false;
    }

    function products(count) {
      return isAmount(count) && count > 0 ? text(count == 1 ? 'item' : 'items', { n: count }) : '';
    }

    // Minutes until a moment, rounded up so nothing happens "in 0 min", or
    // null once it has passed.
    function minutesUntil(target) {
      var left = Date.parse(target) - now();
      if (isNaN(left) || left <= 0) return null;
      return Math.ceil(left / 60000);
    }

    // How long is left, in the largest unit that still says something useful,
    // as the number and the words around it. Minutes are the smallest unit on
    // here: a dashboard is read in passing, and seconds ticking away would be
    // movement without information.
    function remaining(target) {
      var minutes = minutesUntil(target);
      if (minutes === null) return { value: label('now'), kind: 'message' };

      var left = Date.parse(target) - now();
      var hours = Math.round(left / 3600000);
      var days = Math.round(left / 86400000);

      var amount = minutes < 60 ? minutes : (hours < 24 ? hours : days);
      var unit = minutes < 60 ? 'minute' : (hours < 24 ? 'hour' : 'day');

      return { pre: label('in'), value: String(amount), unit: label(amount == 1 ? unit : unit + 's'), kind: 'countdown' };
    }

    // A deadline: named while it is hours away, counted down and called out
    // over its last hour, and gone once it has passed.
    function deadline(at, moment, atKey, inKey, values) {
      var minutes = minutesUntil(at);
      if (minutes === null) return null;

      if (minutes <= URGENT_MINUTES) {
        return { text: text(inKey, Object.assign({ n: minutes }, values)), tone: 'warn' };
      }

      return { text: text(atKey, Object.assign({ t: moment }, values)), tone: null };
    }

    // The note under a placed order. Something in the cart while the order is
    // still open has yet to be put on it, which is a thing left undone with a
    // deadline on it; without a cart the deadline speaks for itself.
    function orderNote(data) {
      var cart = data['cart'];

      if (cart && isAmount(cart['totalPrice']) && cart['totalPrice'] > 0) {
        var open = deadline(data['cutOffAt'], data['cutOffLabel'], 'to-order-at', 'to-order-in', { a: money(cart['totalPrice']) });
        if (open) return { text: open.text, tone: 'warn' };
      }

      return deadline(data['cutOffAt'], data['cutOffLabel'], 'cut-off-at', 'cut-off-in', {});
    }

    // What came back in deposit, once Picnic has counted it.
    function containers(deposit) {
      if (!deposit || !deposit['containers']) return '';

      return deposit['containers']
        .filter(function (container) { return container['name']; })
        .map(function (container) { return container['quantity'] + '× ' + container['name']; })
        .join(', ');
    }

    // Everything on screen, worked out before any of it is put there.
    function view(data) {
      var look = STATES[data['state']] || STATES['empty'];
      var price = showPrices() && isAmount(data['price']) && data['price'] > 0 ? money(data['price']) : '';

      var shown = {
        tone: look.tone,
        icon: look.icon,
        status: look.status ? label(look.status) : '',
        meta: '',
        kind: 'message',
        pre: '',
        headline: '',
        unit: '',
        // the detail line: when, and what about it
        when: '',
        what: '',
        progress: null,
        note: null
      };

      switch (data['state']) {
        case 'ordered':
        case 'announced':
          shown.meta = price;
          if (data['countdownTo']) {
            var left = remaining(data['countdownTo']);
            shown.kind = left.kind;
            shown.pre = left.pre || '';
            shown.headline = left.value;
            shown.unit = left.unit || '';
          } else {
            shown.headline = label('ordered');
          }
          shown.when = data['day'];
          shown.what = data['window'];
          shown.progress = data['progress'];
          shown.note = orderNote(data);
          break;

        case 'arriving':
        case 'overdue':
          shown.meta = price;
          shown.headline = label('now');
          shown.when = data['day'];
          shown.what = data['window'];
          shown.progress = data['progress'];
          break;

        case 'delivered':
          var deposit = data['deposit'];
          shown.meta = price;
          shown.kind = 'countdown';
          shown.pre = label('at');
          shown.headline = data['deliveredTime'];
          shown.when = data['day'];
          shown.what = containers(deposit);
          if (deposit && isAmount(deposit['returned']) && deposit['returned'] > 0) {
            shown.note = { text: text('deposit-returned', { t: money(deposit['returned']) }), tone: 'good' };
          }
          break;

        case 'cart':
          var cart = data['cart'] || {};
          var slot = cart['slotChosen'] ? cart['slot'] : null;

          shown.kind = 'countdown';
          if (showPrices() && isAmount(cart['totalPrice'])) {
            shown.headline = money(cart['totalPrice']);
            shown.meta = products(cart['productCount']);
          } else {
            shown.headline = products(cart['productCount']);
          }

          // a slot someone picked is when this would arrive; the one Picnic
          // suggests by itself is not held for anyone, so it is not named
          shown.when = slot ? slot['day'] : label('no-slot');
          shown.what = slot ? slot['window'] : '';

          if (isAmount(cart['minimumShort']) && cart['minimumShort'] > 0) {
            shown.note = { text: text('minimum', { t: money(cart['minimumShort']) }), tone: 'warn' };
          } else if (slot) {
            shown.note = deadline(slot['cutOffAt'], slot['cutOffLabel'], 'order-before', 'order-in', {});
          }
          break;

        case 'signed_out':
          shown.headline = label('signed-out');
          shown.when = label('signed-out-detail');
          break;

        case 'stale':
          // what the app last heard is not repeated, only when it heard it
          shown.headline = label('stale');
          shown.when = data['checkedLabel'] ? text('stale-since', { t: data['checkedLabel'] }) : '';
          break;

        default:
          shown.headline = label('empty');
          shown.when = data['cartKnown'] ? label('empty-cart') : '';
      }

      return shown;
    }

    function render() {
      if (state === null) return;

      var shown = view(state);

      element('tile').dataset.tone = shown.tone;
      element('badge').dataset.icon = shown.icon;

      element('status').textContent = shown.status;
      element('meta').textContent = shown.meta;

      element('pre').textContent = shown.pre;
      element('pre').hidden = shown.pre == '';
      element('value').textContent = shown.headline;
      element('unit').textContent = shown.unit;
      element('unit').hidden = shown.unit == '';
      element('headline').dataset.kind = shown.kind;

      element('when').textContent = shown.when;
      element('what').textContent = shown.what;
      element('detail').hidden = shown.when == '' && shown.what == '';

      var progress = shown.progress;
      var known = typeof progress == 'number' && isFinite(progress);
      element('track').hidden = !known;
      element('fill').style.width = known ? Math.round(progress * 100) + '%' : '0%';

      element('note').textContent = shown.note ? shown.note.text : '';
      element('note').dataset.tone = shown.note && shown.note.tone ? shown.note.tone : '';
      element('note').hidden = !shown.note;
    }
  </script>
</body>

</html>
